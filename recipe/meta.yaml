{% set name = "dask-deltatable" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d75af862b5d89d435bf425b5ee9c46ef557a8993fcaba6090013c3b139153d29

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - dask
    - deltalake
    - fsspec
    - pyarrow

test:
  imports:
    - dask_deltatable
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/dask-contrib/dask-deltatable
  summary: Dask + Delta Table
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - charlesbluca
    - fjetter
    - jacobtomlinson
    - jrbourbeau
